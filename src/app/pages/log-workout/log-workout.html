<div class="space-y-6">
  <h1 class="text-2xl font-bold text-white">Log Workout</h1>

  <!-- Date & Notes -->
  <div class="bg-gray-900 rounded-xl p-4 border border-gray-800 space-y-4">
    <div>
      <label class="block text-sm text-gray-400 mb-1">Date</label>
      <input
        type="date"
        [(ngModel)]="date"
        class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white w-full focus:outline-none focus:border-indigo-500"
      />
    </div>
    <div>
      <label class="block text-sm text-gray-400 mb-1">Notes (optional)</label>
      <input
        type="text"
        [(ngModel)]="notes"
        placeholder="How did it feel?"
        class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white w-full focus:outline-none focus:border-indigo-500"
      />
    </div>
    <div>
      <label class="block text-sm text-gray-400 mb-1">Split (optional)</label>
      <select
        [(ngModel)]="split"
        class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white w-full focus:outline-none focus:border-indigo-500"
      >
        <option value="">Select split...</option>
        @for (s of splits; track s) {
          <option [value]="s">{{ s }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Add Exercise -->
  <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
    <h2 class="text-gray-300 font-semibold mb-3">Add Exercise</h2>
    <div class="flex gap-2">
      <select
        [(ngModel)]="selectedExerciseId"
        class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
      >
        <option value="">Select exercise...</option>
        @for (cat of categories(); track cat) {
          <optgroup [label]="cat">
            @for (ex of exercises(); track ex.id) {
              @if (ex.category === cat) {
                <option [value]="ex.id">{{ ex.name }}{{ ex.isCustom ? ' *' : '' }}</option>
              }
            }
          </optgroup>
        }
      </select>
      <button
        (click)="addExerciseToWorkout()"
        class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg transition-colors"
      >
        Add
      </button>
    </div>

    <button
      (click)="showAddExercise = !showAddExercise"
      class="text-indigo-400 hover:text-indigo-300 text-sm mt-3 transition-colors"
    >
      {{ showAddExercise ? 'Cancel' : '+ Create custom exercise' }}
    </button>

    @if (showAddExercise) {
      <div class="mt-3 grid grid-cols-2 gap-2">
        <input
          type="text"
          [(ngModel)]="newExerciseName"
          placeholder="Exercise name"
          class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
        />
        <input
          type="text"
          [(ngModel)]="newExerciseCategory"
          placeholder="Category"
          class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
        />
        <button
          (click)="addCustomExercise()"
          class="col-span-2 bg-green-700 hover:bg-green-600 text-white py-2 rounded-lg transition-colors"
        >
          Save Exercise
        </button>
      </div>
    }
  </div>

  <!-- Exercises in workout -->
  @for (ex of draft.exercises(); track ex.exerciseId) {
    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800 space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="font-semibold text-white">{{ ex.exerciseName }}</h3>
        <button
          (click)="draft.removeExercise(ex.exerciseId)"
          class="text-red-400 hover:text-red-300 text-sm transition-colors"
        >
          Remove
        </button>
      </div>

      <!-- Sets -->
      <div class="space-y-2">
        <div class="grid grid-cols-3 gap-2 text-xs text-gray-500 px-1">
          <span>Set</span><span>Reps</span><span>Weight (kg)</span>
        </div>
        @for (set of ex.sets; track $index) {
          <div class="grid grid-cols-3 gap-2 items-center">
            <span class="text-gray-400 text-sm px-1">{{ $index + 1 }}</span>
            <input
              type="number"
              min="0"
              [value]="set.reps"
              (input)="draft.updateSet(ex.exerciseId, $index, 'reps', +$any($event.target).value)"
              class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-white w-full focus:outline-none focus:border-indigo-500 text-sm"
            />
            <div class="flex gap-1">
              <input
                type="number"
                min="0"
                step="0.5"
                [value]="set.weightKg"
                (input)="draft.updateSet(ex.exerciseId, $index, 'weightKg', +$any($event.target).value)"
                class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-white w-full focus:outline-none focus:border-indigo-500 text-sm"
              />
              @if (ex.sets.length > 1) {
                <button
                  (click)="draft.removeSet(ex.exerciseId, $index)"
                  class="text-red-400 hover:text-red-300 transition-colors px-1"
                >
                  ✕
                </button>
              }
            </div>
          </div>
        }
      </div>
      <button
        (click)="draft.addSet(ex.exerciseId)"
        class="text-indigo-400 hover:text-indigo-300 text-sm transition-colors"
      >
        + Add set
      </button>
    </div>
  }

  <!-- Save -->
  @if (draft.exercises().length > 0) {
    <button
      (click)="saveWorkout()"
      [disabled]="!draft.canSave()"
      class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white py-3 rounded-xl font-semibold text-lg transition-colors"
    >
      Save Workout
    </button>
  }
</div>
